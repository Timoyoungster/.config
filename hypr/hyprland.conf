# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

ecosystem:no_update_news = true

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor = ,preferred,auto,1
monitor = eDP-1,2560x1600@180,auto,1.67

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = ghostty +new-window
$bareterm = ghostty -e /bin/env zsh
$browser = qutebrowser
$menu = tofi-run | xargs hyprctl dispatch exec


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = mako
exec-once = systemctl --user start hyprpolkitagent
exec-once = hyprpaper
exec-once = batsignal
exec-once = [workspace name:code silent] ghostty
exec-once = [workspace name:browser silent] $browser
exec-once = [workspace name:1password] 1password
exec-once = pcloudcc -u timo.proemer04@gmail.com -m /home/timo/pcloud -d

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = HYPRCURSOR_THEME,"Future-Cyan-Hyprcursor_Theme"
env = HYPRCURSOR_SIZE,40
env = XCURSOR_SIZE,24

#####################
### LOOK AND FEEL ###
#####################

# exec = gsettings set org.gnome.desktop.interface gtk-theme "YOUR_DARK_GTK3_THEME"   # for GTK3 apps
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps
env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general { 
    gaps_in = 5
    gaps_out = 20

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    # col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    # col.active_border = rgba(e198f4ee) rgba(be69f2ee) 45deg
    col.active_border = rgba(7c6ef8ee) rgba(5b82f5ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false 

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle

}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = false
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = false

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default, fade
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
    force_split = 2
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    drop_at_cursor = false
    smart_resizing = false
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc { 
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}

cursor {
  inactive_timeout = 5
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant = dvorak
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    accel_profile = flat

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

device {
    name = cradio-keyboard
    kb_layout = us
    kb_variant = 
    kb_model =
    kb_options =
    kb_rules =

    enabled = true
    keybinds = true
    resolve_binds_by_sym = 1
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
# gestures {
#     workspace_swipe = false
# }

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
# device {
#     name = epic-mouse-v1
#     sensitivity = -0.5
# }


####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, T, exec, $terminal
bind = $mainMod SHIFT, T, exec, $bareterm
bind = $mainMod, B, exec, $browser
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, X, exit
bind = $mainMod, F, togglefloating
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod SHIFT, SPACE, exec, 1password --quick-access
bind = $mainMod, S, togglesplit
bind = $mainMod, Z, fullscreen, 0
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, P, pin

# Media control binds
# (non working commented out)
# l -> do stuff even when locked
# e -> repeats when key is held 
bindle=, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_SINK@ 10%+ -l 1.0
bindle=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_SINK@ 10%- -l 1.0
bindle=, XF86MonBrightnessUp, exec, brightnessctl set +10%
bindle=, XF86MonBrightnessDown, exec, brightnessctl set 10%-
# bindle=, XF86Search, exec, $menu
# bindl=, XF86AudioMute, exec, amixer set Master toggle
bindl=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=, XF86AudioPlay, exec, playerctl play-pause # the stupid key is called play , but it toggles 
bindl=, XF86AudioNext, exec, playerctl next 
bindl=, XF86AudioPrev, exec, playerctl previous

# Notification Manager binds
bindle= $mainMod, D, exec, makoctl dismiss
bindle= $mainMod, C, exec, makoctl dismiss --all
bindle= $mainMod, G, exec, makoctl invoke & makoctl dismiss

# OBS Control binds
bindl= $mainMod, F1, exec, $HOME/.config/hypr/obs_control/obs-scene-switch.sh 'Screen All'
bindl= $mainMod, F2, exec, $HOME/.config/hypr/obs_control/obs-scene-switch.sh 'Screen Left'
bindl= $mainMod, F3, exec, $HOME/.config/hypr/obs_control/obs-scene-switch.sh 'Screen Middle'
bindl= $mainMod, F4, exec, $HOME/.config/hypr/obs_control/obs-scene-switch.sh 'Screen Right'
bindl= $mainMod, F5, exec, $HOME/.config/hypr/obs_control/obs-scene-switch.sh 'Cam'

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move focus cycle
bind = $mainMod, N, cyclenext
bind = $mainMod SHIFT, N, cyclenext, prev

# Move window with mainMod + shift + arrow keys
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d


bind=$mainMod,R,submap,resize # will switch to a submap called resize

submap=resize # will start a submap called "resize"
binde=,l,resizeactive,10 0
binde=,h,resizeactive,-10 0
binde=,k,resizeactive,0 -10
binde=,j,resizeactive,0 10
bind=,escape,submap,reset # use reset to go back to the global submap
submap=reset # will reset the submap, meaning end the current one and return to the global one.

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, name:browser
bind = $mainMod, 2, workspace, name:social
bind = $mainMod, 3, workspace, name:utils
bind = $mainMod, 4, workspace, name:code
bind = $mainMod, 5, workspace, name:1password

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, name:browser
bind = $mainMod SHIFT, 2, movetoworkspace, name:social
bind = $mainMod SHIFT, 3, movetoworkspace, name:utils
bind = $mainMod SHIFT, 4, movetoworkspace, name:code
bind = $mainMod SHIFT, 5, movetoworkspace, name:1password

# Example special workspace (scratchpad)
bind = $mainMod, 0, togglespecialworkspace, magic
bind = $mainMod SHIFT, 0, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# screenshot
bind = $mainMod ALT, S, exec, hyprshot -m active -m window -- imv
bind = $mainMod SHIFT, S, exec, hyprshot -m active -m window --clipboard-only


##############################
### WINDOWS AND WORKSPACES ###
##############################

workspace = name:browser, monitor:eDP-1
workspace = name:social, monitor:eDP-1
workspace = name:utils, monitor:eDP-1
workspace = name:code, monitor:eDP-1
workspace = name:1password, monitor:eDP-1

windowrule {
    name = probably-like-this
    match:class = .*
	suppress_event = maximize
}
windowrule {
    name = center-1password-popup
    match:class = ^(1Password)$
    center = on
}

