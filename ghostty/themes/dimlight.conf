# Dimlight — low-contrast, muted Ghostty theme
# Warm grey text on a soft charcoal background, desaturated accents.
# Pairs with nvim/colors/dimlight.lua (which uses this palette via cterm indices).

# --- Palette ---
# black — used as a subtle "surface" (selection, color column)
palette = 0=#2b2d33
# red — dusty rose
palette = 1=#b87a73
# green — sage
palette = 2=#8ea07c
# yellow — sand
palette = 3=#bba070
# blue — slate
palette = 4=#7f93ab
# magenta — faded mauve
palette = 5=#a08aa6
# cyan — muted teal
palette = 6=#7fa39f
# white — main text grey
palette = 7=#aaa69d

# bright black — dim UI / delimiters
palette = 8=#5d6068
# bright variants: only slightly lifted, never neon
palette = 9=#c68d86
palette = 10=#9fb08e
palette = 11=#c6ae82
palette = 12=#93a5bb
palette = 13=#b09db5
palette = 14=#92b3af
palette = 15=#c2beb4

# --- Core colors ---
background = #1f2024
foreground = #b1ada4
cursor-color = #9f9a90
cursor-text = #1f2024
selection-background = #363840
selection-foreground = #c2beb4
