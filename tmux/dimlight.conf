# Dimlight — minimal, low-contrast tmux theme
# Matches ghostty/themes/dimlight.conf and nvim/colors/dimlight.lua

# Base styling
set -g status on
set -g status-justify centre
set -g status-left-length 40
set -g status-right-length 150
set -g status-style "bg=#1f2024,fg=#aaa69d"

# Pane borders
set -g pane-border-style "fg=#2b2d33"
set -g pane-active-border-style "fg=#5d6068"

# Message area (prompts, searches)
set -g message-style "bg=#2b2d33,fg=#c2beb4"
set -g message-command-style "bg=#2b2d33,fg=#bba070"

# Window titles
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-separator "  "
setw -g window-status-style "fg=#5d6068,bg=default"
setw -g window-status-current-style "fg=#c2beb4,bg=default"
setw -g window-status-activity-style "fg=#bba070,bg=default"
setw -g window-status-bell-style "fg=#b87a73,bg=default"

# Status line content
set -g status-left "#[fg=#7f93ab] #[fg=#aaa69d]#S"
set -g status-right "#[fg=#8ea07c]%I:%M %p #[fg=#5d6068]|#[fg=#aaa69d] %b %d"

# Copy mode / selection
set -g mode-style "bg=#363840,fg=#c2beb4"

# Popups (prefix g)
set -g popup-border-style "fg=#5d6068"

# Clock (prefix t is rebound, but `clock-mode` still uses this)
setw -g clock-mode-colour "#7f93ab"
